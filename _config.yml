# PAISE Workshop website
# Based on the al-folio Jekyll theme
# Official website: https://paise.org

# Site identity
title: PAISE 2027
post_title: "PAISE 2027: 9th Workshop on Parallel AI and Systems for the Edge"
first_name: PAISE
middle_name:
last_name: 2027
email:
description: "Parallel AI and Systems for the Edge (PAISE) workshop"
footer_text:
keywords: "PAISE, edge computing, artificial intelligence, distributed computing, IPDPS"
lang: en
icon: ⚛️
url: https://paise.org
baseurl: ""
last_updated: false
impressum_path:

# Theme and layout
highlight_theme_light: github
highlight_theme_dark: native
repo_theme_light: default
repo_theme_dark: dark
repo_trophies:
  enabled: false
  theme_light: flat
  theme_dark: gitdimmed
rss_icon: true
navbar_fixed: true
footer_fixed: true
max_width: 800px

# Metadata and sharing
serve_og_meta: true
serve_schema_org: false
og_image:

# Social links (left empty unless configured)
github_username:
gitlab_username:
twitter_username:
mastodon_username:
linkedin_username:
telegram_username:
scholar_userid:
semanticscholar_id:
whatsapp_number:
orcid_id:
medium_username:
quora_username:
publons_id:
lattes_id:
osf_id:
research_gate_profile:
scopus_id:
blogger_url:
work_url:
keybase_username:
wikidata_id:
wikipedia_id:
dblp_url:
stackoverflow_id:
kaggle_id:
lastfm_id:
spotify_id:
pinterest_id:
unsplash_id:
instagram_id:
facebook_id:
youtube_id:
discord_id:
zotero_username:
contact_note: ""

# Keep existing Google Analytics setting. Disable if analytics is not needed.
google_analytics: 
cronitor_analytics:
google_site_verification:
bing_site_verification:

# Blog/legacy theme settings
pagination:
  enabled: true
related_blog_posts:
  enabled: false
  max_related: 5
giscus:
  repo:
  repo_id:
  category:
  category_id:
  mapping: title
  strict: 1
  reactions_enabled: 1
  input_position: bottom
  theme: preferred_color_scheme
  emit_metadata: 0
  lang: en
disqus_shortname:

collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/
announcements:
  enabled: true
  scrollable: true
  limit: 5
latest_posts:
  enabled: false
  scrollable: false
  limit: 3

# Jekyll build configuration
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start: 1
include: ['_pages']
exclude:
  - bin
  - Gemfile
  - Gemfile.lock
  - vendor
keep_files:
  - CNAME
  - .nojekyll
  - .git

# Keep existing plugin list for build compatibility.
# Remove unused gems/plugins only after testing the build.
plugins:
  - jekyll-archives
  - jekyll-diagrams
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji

defaults:
  - scope:
      path: assets
    values:
      sitemap: false

jekyll-minifier:
  exclude: ['robots.txt']
  uglifier_args:
    harmony: true
jekyll-archives:
  enabled: []
  layouts:
    year: archive-year
    tag: archive-tag
    category: archive-category
  permalinks:
    year: '/blog/:year/'
    tag: '/blog/tag/:name/'
    category: '/blog/category/:name/'
display_tags: []
display_categories: []

# Legacy al-folio bibliography settings retained for template compatibility
scholar:
  last_name: [Einstein]
  first_name: [Albert, A.]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending
badges:
  altmetric_badge: false
  dimensions_badge: false
filtered_bibtex_keywords: [abbr, abstract, arxiv, bibtex_show, html, pdf, selected, supp, blog, code, poster, slides, website, preview, altmetric]
max_author_limit: 3
more_authors_animation_delay: 10

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

imagemagick:
  enabled: true
  widths: [480, 800, 1400]
  input_directories: [assets/img/]
  input_formats: ['.jpg', '.jpeg', '.png', '.tiff']
  output_formats:
    webp: "-resize 800x"
jekyll-diagrams: {}

# Optional theme features
enable_google_analytics: false
enable_cronitor_analytics: false
enable_google_verification: false
enable_bing_verification: false
enable_masonry: false
enable_math: false
enable_tooltips: false
enable_darkmode: true
enable_navbar_social: false
enable_project_categories: false
enable_medium_zoom: false
enable_progressbar: false

